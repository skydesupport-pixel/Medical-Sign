# Netlify deploys the demo build.
#
# docs/ is generated from public/ by build-demo.js, so Netlify runs that
# itself rather than trusting whatever was last committed - the demo can
# then never drift away from the real app.
#
# Static only: this serves the serverless demo, NOT server.js. The real
# system needs a host that runs Node (Render, Railway, Fly).

[build]
  command = "node build-demo.js"
  publish = "docs"

[build.environment]
  NODE_VERSION = "20"

# A mistyped address lands on the app rather than a bare 404. Real files
# always win over this, so display.html and the brand assets are untouched.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The service worker must never be served from cache, or a new deploy
# cannot replace it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
