# Deploy the REAL system - server, database, live sign updates.
#
# This is not the Netlify demo. Netlify serves static files, so it can only
# ever host docs/. This runs server.js, which means data that is still there
# tomorrow and the login gate actually doing something.
#
# Render reads this file when you point it at the repository:
#   render.com -> New -> Blueprint -> pick Medical-Sign
#
# ---------------------------------------------------------------------
#  The one thing to understand before deploying
#
#  A hosted server's application folder is WIPED on every deploy. The
#  database has to live on a mounted disk that survives, which is what the
#  disk block below is for, and why MEDSIGN_DATA_DIR points into it.
#
#  Persistent disks are a paid feature on Render (a Starter instance, a
#  few dollars a month at the time of writing - check current pricing).
#  On a free instance you get no disk and the filesystem resets, so every
#  redeploy and every wake-from-sleep starts the hospital from scratch.
#  Free is fine for showing someone the system; it is not fine for running
#  a department.
# ---------------------------------------------------------------------

services:
  - type: web
    name: medical-sign
    runtime: node
    plan: starter          # "free" works, but see the note above about the disk
    region: frankfurt      # closest of Render's regions to Israel
    buildCommand: ''       # zero dependencies - there is nothing to build
    startCommand: node server.js
    healthCheckPath: /api/public
    envVars:
      - key: MEDSIGN_DATA_DIR
        value: /var/medsign-data
      - key: NODE_VERSION
        value: '20'
    disk:
      name: medsign-data
      mountPath: /var/medsign-data
      sizeGB: 1
